name: gearguard
description: GearGuard - PPE compliance scanning, attendance and safety reporting for the workplace.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  bloc: ^9.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  meta: ^1.17.0
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
