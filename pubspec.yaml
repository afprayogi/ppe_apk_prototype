name: vivatpass
description: "VivatPass - PPE Safety Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+1

  # UI / Responsiveness
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # State Management
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1

  # Database
  sqflite: ^2.4.2

  # AI / Deteksi – sekarang menggunakan Ultralytics YOLO Android Library
  # via MethodChannel (native Kotlin). Tidak perlu package Dart tambahan.

  # Permissions
  permission_handler: ^11.3.1
  tflite_flutter: ^0.12.1

  # Gallery & image pick
  image_picker: ^1.1.2

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Settings persistence
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/models/
    - assets/validasi/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
